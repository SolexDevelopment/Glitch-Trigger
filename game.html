<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glitch Trigger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background: linear-gradient(135deg, #1a0b2e, #4c1d95, #2e1065);
            background-size: 200% 200%;
            animation: fadeIn 2s ease-in-out forwards, gradientShift 10s ease infinite;
            opacity: 0; 
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .pink-text {
            color: #ff2a85;
            text-shadow: 2px 2px 0px #8b0046;
        }

        .pink-btn {
            background-color: #ff2a85;
            color: white;
            border: 4px solid #ff7eb3;
            box-shadow: 0px 6px 0px #8b0046;
            transition: transform 0.1s, box-shadow 0.1s, background-color 0.2s;
        }

        .pink-btn:hover {
            background-color: #ff479b;
        }

        .pink-btn:active {
            transform: translateY(6px);
            box-shadow: 0px 0px 0px #8b0046;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden m-0 p-8 flex flex-col justify-start items-start text-white">

    <h1 class="text-3xl md:text-5xl pink-text mb-8 mt-4 ml-4 tracking-widest">
        Glitch Trigger
    </h1>

    <div id="btn-container" class="ml-4 flex flex-col gap-6">
        <button id="new-game-btn" class="pink-btn py-4 px-8 text-xl uppercase cursor-pointer text-left w-64 text-center">
            New Game
        </button>
    </div>

    <div id="prank-container" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; background: black;">
        <img id="prank-image" src="https://i.postimg.cc/dtPkvc1z/bibisi.png" alt="Prank Image" style="width: 100%; height: 100%; object-fit: cover;">
        <!-- Point this to your local audio file uploaded on GitHub -->
        <audio id="prank-audio" src="audio.mp3" loop></audio>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const newGameBtn = document.getElementById("new-game-btn");
            const audio = document.getElementById("prank-audio");

            newGameBtn.addEventListener('click', async () => {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                }
                
                document.getElementById('prank-container').style.display = 'block';
                
                audio.volume = 1.0;
                audio.play().catch(e => console.log("Audio blocked by browser:", e));
                
                console.log("Running Supabase function geg...");
            });
        });
    </script>
</body>
</html>
