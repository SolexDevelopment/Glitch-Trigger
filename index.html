    <title>Glitch Trigger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background: linear-gradient(135deg, #1a0b2e, #4c1d95, #2e1065);
            background-size: 200% 200%;
            animation: fadeIn 2s ease-in-out forwards, gradientShift 10s ease infinite;
            opacity: 0; /* Initial state for fade-in */
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glitch text effect utility */
        .pink-text {
            color: #ff2a85;
            text-shadow: 2px 2px 0px #8b0046;
        }

        /* Button styling */
        .pink-btn {
            background-color: #ff2a85;
            color: white;
            border: 4px solid #ff7eb3;
            box-shadow: 0px 6px 0px #8b0046;
            transition: transform 0.1s, box-shadow 0.1s, background-color 0.2s;
        }

        .pink-btn:hover {
            background-color: #ff479b;
        }

        .pink-btn:active {
            transform: translateY(6px);
            box-shadow: 0px 0px 0px #8b0046;
        }
        
        .blinking-cursor::after {
            content: '_';
            animation: blink 1s step-end infinite;
        }
        
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>

        Glitch Trigger

    <!-- Action buttons container -->
    <div id="btn-container" class="ml-4 flex flex-col gap-6">
        <button id="start-btn" class="pink-btn py-4 px-8 text-xl uppercase cursor-pointer text-left w-64 text-center">
            Start
        </button>
        <button id="exit-btn" class="pink-btn py-4 px-8 text-xl uppercase cursor-pointer text-left w-64 text-center">
            Exit
        </button>
    </div>

    <!-- Hidden typing text container -->
